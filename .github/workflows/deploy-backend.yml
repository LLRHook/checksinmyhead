# Phase G only. NOT CI-CONFIRMED: native/signed/GUI, images, live providers, adoption/drain, recovery and performance qualification.
name: Publish checked backend
'on':
  workflow_call:
    secrets:
      DELIVERY_RENDER_DEPLOY_HOOK_URL:
        required: true
    inputs:
      source:
        type: string
        required: true
      controller:
        type: string
        required: true
      receipt:
        type: string
        required: true
      skip_deploy:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: backend-production
    concurrency:
      group: backend-production
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        ref: ${{ inputs.controller }}
        path: control
        fetch-depth: 0
        persist-credentials: false
    - env:
        CONTROLLER: ${{ inputs.controller }}
        SOURCE: ${{ inputs.source }}
        GATE_RECEIPT: ${{ inputs.receipt }}
        RELEASE_POLICY: ${{ vars.RELEASE_POLICY }}
        DELIVERY_TARGET: backend
        DELIVERY_RENDER_DEPLOY_HOOK_URL: ${{ secrets.DELIVERY_RENDER_DEPLOY_HOOK_URL }}
        VERIFY_ONLY: ${{ inputs.skip_deploy }}
      run: python3 control/ops/ci/delivery_gate.py publish --repo control --controller "$CONTROLLER" --source "$SOURCE"
