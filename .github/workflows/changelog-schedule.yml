name: Changelog schedule
'on':
  schedule:
  - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: changelog-reconcile
  cancel-in-progress: false
  queue: max
jobs:
  changelog:
    if: github.repository == 'LLRHook/checksinmyhead'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: changelog
      deployment: false
    permissions:
      contents: read
      pull-requests: write
      checks: write
      actions: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: refs/heads/main
        path: control
        persist-credentials: false
    - name: Reconcile Changelog
      run: |
        python3 -c 'import sys; assert sys.version_info[:2] == (3,12)'
        python3 control/ops/changelog/changelog.py
      env:
        GITHUB_TOKEN: ${{ github.token }}
        CHANGELOG_MODE: ${{ vars.CHANGELOG_MODE }}
        CHANGELOG_DISCORD_CHANNEL_ID: ${{ vars.CHANGELOG_DISCORD_CHANNEL_ID }}
        CHANGELOG_DISCORD_BOT_TOKEN: ${{ secrets.CHANGELOG_DISCORD_BOT_TOKEN }}
        CHANGELOG_MERGE_TOKEN: ${{ secrets.CHANGELOG_MERGE_TOKEN }}
