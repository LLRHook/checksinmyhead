name: Build signed IPA
description: Unavailable until phase F implements verified exact processed-build receipts; no signing or upload in phase G.
inputs:
  build-number:
    description: CFBundleVersion for this build
    required: true
  build-name:
    description: CFBundleShortVersionString (marketing version)
    required: true
  certificate-base64:
    description: Base64-encoded Apple Distribution .p12
    required: true
  p12-password:
    description: Password for the .p12
    required: true
  provisioning-profile-base64:
    description: Base64-encoded App Store .mobileprovision
    required: true
  team-id:
    description: Apple Developer team ID
    required: true
  bundle-id:
    description: Bundle identifier being signed
    required: true
runs:
  using: composite
  steps:
  - shell: bash
    run: 'echo ''F-phase required: signed artifact/source/origin receipt handling is unavailable.'' >&2

      exit 1

      '
