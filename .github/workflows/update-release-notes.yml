# Phase G only. NOT CI-CONFIRMED: native/signed/GUI, images, live providers, adoption/drain, recovery and performance qualification.
name: Update App Store release notes (phase F unavailable)
'on':
  workflow_dispatch:
    inputs:
      version:
        description: App Store version to edit, e.g. 1.3.0
        required: true
        type: string
      release_notes:
        description: New What's New text
        required: true
        type: string
      allow_cancel:
        description: If the version is locked, cancel the pending review submission to edit it (forfeits queue position)
        required: false
        default: false
        type: boolean
      resubmit:
        description: After a cancel + edit, resubmit for review
        required: false
        default: true
        type: boolean
      source:
        type: string
        description: Full source SHA (blank = C); phase F publication unavailable
        required: false
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      candidate: ${{ steps.resolve.outputs.candidate }}
      controller: ${{ steps.resolve.outputs.controller }}
      backend: ${{ steps.resolve.outputs.backend }}
      web: ${{ steps.resolve.outputs.web }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        ref: ${{ github.sha }}
        path: control
        fetch-depth: 0
        persist-credentials: false
    - id: resolve
      env:
        CONTROLLER: ${{ github.sha }}
        REQUESTED_SOURCE: ${{ inputs.source || '' }}
        REQUESTED_TARGET: ${{ inputs.target || 'checks' }}
        RELEASE_POLICY: ${{ vars.RELEASE_POLICY }}
        BEFORE_SOURCE: ${{ github.event.before || '' }}
      run: python3 control/ops/ci/delivery_gate.py resolve --repo control --controller "$CONTROLLER"
  checks:
    needs: resolve
    uses: ./.github/workflows/checks.yml
    with:
      source_sha: ${{ needs.resolve.outputs.candidate }}
      controller_sha: ${{ needs.resolve.outputs.controller }}
      scope: all
  unavailable:
    needs:
    - resolve
    - checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        ref: ${{ github.sha }}
        path: control
        fetch-depth: 0
        persist-credentials: false
    - run: python3 control/ops/ci/delivery_gate.py ios-unavailable
