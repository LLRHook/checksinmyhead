# Phase G only. NOT CI-CONFIRMED: native/signed/GUI, images, live providers, adoption/drain, recovery and performance qualification.
name: Deploy to TestFlight (phase F unavailable)
'on':
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number (blank = next available from App Store Connect)
        required: false
        type: string
      release_notes:
        description: What to test (TestFlight notes)
        required: false
        default: 'Billington 2.0: collaborative trip tabs, app-first invites, multi-currency receipts with conversion previews,
          creator-controlled tab settings, currency-aware balances, and a read-only web handoff. Receipt scanning, external
          payment links, and the existing Quick Split and Lazy Mode flows remain supported.'
        type: string
      source:
        type: string
        description: Full source SHA (blank = C); phase F publication unavailable
        required: false
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      candidate: ${{ steps.resolve.outputs.candidate }}
      controller: ${{ steps.resolve.outputs.controller }}
      backend: ${{ steps.resolve.outputs.backend }}
      web: ${{ steps.resolve.outputs.web }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        ref: ${{ github.sha }}
        path: control
        fetch-depth: 0
        persist-credentials: false
    - id: resolve
      env:
        CONTROLLER: ${{ github.sha }}
        REQUESTED_SOURCE: ${{ inputs.source || '' }}
        REQUESTED_TARGET: ${{ inputs.target || 'checks' }}
        RELEASE_POLICY: ${{ vars.RELEASE_POLICY }}
        BEFORE_SOURCE: ${{ github.event.before || '' }}
      run: python3 control/ops/ci/delivery_gate.py resolve --repo control --controller "$CONTROLLER"
  checks:
    needs: resolve
    uses: ./.github/workflows/checks.yml
    with:
      source_sha: ${{ needs.resolve.outputs.candidate }}
      controller_sha: ${{ needs.resolve.outputs.controller }}
      scope: all
  unavailable:
    needs:
    - resolve
    - checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        ref: ${{ github.sha }}
        path: control
        fetch-depth: 0
        persist-credentials: false
    - run: python3 control/ops/ci/delivery_gate.py ios-unavailable
