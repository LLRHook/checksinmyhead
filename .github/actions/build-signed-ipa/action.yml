name: Build signed IPA
description: Authorize, build once with locked toolchain, inspect IPA identity and
  always clean owned signing material.
inputs:
  build-number:
    description: CFBundleVersion for this build
    required: true
  build-name:
    description: CFBundleShortVersionString (marketing version)
    required: true
  certificate-base64:
    description: Base64-encoded Apple Distribution .p12
    required: true
  p12-password:
    description: Password for the .p12
    required: true
  provisioning-profile-base64:
    description: Base64-encoded App Store .mobileprovision
    required: true
  team-id:
    description: Apple Developer team ID
    required: true
  bundle-id:
    description: Bundle identifier being signed
    required: true
runs:
  using: composite
  steps:
  - id: build
    shell: bash
    env:
      BUILD_NUMBER: ${{ inputs.build-number }}
      BUILD_NAME: ${{ inputs.build-name }}
      CERTIFICATE_BASE64: ${{ inputs.certificate-base64 }}
      P12_PASSWORD: ${{ inputs.p12-password }}
      PROFILE_BASE64: ${{ inputs.provisioning-profile-base64 }}
      TEAM_ID: ${{ inputs.team-id }}
      BUNDLE_ID: ${{ inputs.bundle-id }}
    run: python3 control/ops/ci/ios_sign.py
outputs:
  ipa-path:
    description: Exact inspected IPA
    value: ${{ steps.build.outputs.ipa_path }}
  ipa-sha256:
    description: SHA256 of inspected IPA
    value: ${{ steps.build.outputs.ipa_sha256 }}
