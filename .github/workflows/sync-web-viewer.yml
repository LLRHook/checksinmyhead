# Phase G only. NOT CI-CONFIRMED: native/signed/GUI, images, live providers, adoption/drain, recovery and performance qualification.
name: Publish checked web
'on':
  workflow_call:
    secrets:
      DELIVERY_VERCEL_DEPLOY_KEY:
        required: true
    inputs:
      source:
        type: string
        required: true
      controller:
        type: string
        required: true
      receipt:
        type: string
        required: true
permissions:
  contents: read
jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: web-production
    concurrency:
      group: web-production
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.controller }}
        path: control
        fetch-depth: 0
        persist-credentials: false
    - env:
        CONTROLLER: ${{ inputs.controller }}
        SOURCE: ${{ inputs.source }}
        GATE_RECEIPT: ${{ inputs.receipt }}
        RELEASE_POLICY: ${{ vars.RELEASE_POLICY }}
        DELIVERY_TARGET: web
        DELIVERY_VERCEL_DEPLOY_KEY: ${{ secrets.DELIVERY_VERCEL_DEPLOY_KEY }}
      run: python3 control/ops/ci/delivery_gate.py publish --repo control --controller "$CONTROLLER" --source "$SOURCE"
