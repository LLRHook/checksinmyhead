# Phase G only. NOT CI-CONFIRMED: native/signed/GUI, images, live providers, adoption/drain, recovery and performance qualification.
name: Release to App Store (phase F unavailable)
'on':
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version to release, e.g. 1.3.1
        required: true
        type: string
      release_notes:
        description: What's New text (blank = leave existing text unchanged)
        required: false
        type: string
      release_type:
        description: When to release once approved
        required: false
        default: AFTER_APPROVAL
        type: choice
        options:
        - AFTER_APPROVAL
        - MANUAL
      submit_for_review:
        description: Submit to App Review (uncheck to stage the version only)
        required: false
        default: true
        type: boolean
      source:
        type: string
        description: Full source SHA (blank = C); phase F publication unavailable
        required: false
  push:
    tags:
    - release-v*
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      candidate: ${{ steps.resolve.outputs.candidate }}
      controller: ${{ steps.resolve.outputs.controller }}
      backend: ${{ steps.resolve.outputs.backend }}
      web: ${{ steps.resolve.outputs.web }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        ref: ${{ github.sha }}
        path: control
        fetch-depth: 0
        persist-credentials: false
    - id: resolve
      env:
        CONTROLLER: ${{ github.sha }}
        REQUESTED_SOURCE: ${{ inputs.source || '' }}
        REQUESTED_TARGET: ${{ inputs.target || 'checks' }}
        RELEASE_POLICY: ${{ vars.RELEASE_POLICY }}
        BEFORE_SOURCE: ${{ github.event.before || '' }}
      run: python3 control/ops/ci/delivery_gate.py resolve --repo control --controller "$CONTROLLER"
  checks:
    needs: resolve
    uses: ./.github/workflows/checks.yml
    with:
      source_sha: ${{ needs.resolve.outputs.candidate }}
      controller_sha: ${{ needs.resolve.outputs.controller }}
      scope: all
  unavailable:
    needs:
    - resolve
    - checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        ref: ${{ github.sha }}
        path: control
        fetch-depth: 0
        persist-credentials: false
    - run: python3 control/ops/ci/delivery_gate.py ios-unavailable
