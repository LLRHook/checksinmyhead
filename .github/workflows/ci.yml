# Phase G only. NOT CI-CONFIRMED: native/signed/GUI, images, live providers, adoption/drain, recovery and performance qualification.
name: CI
'on':
  pull_request: null
  push:
    branches:
    - main
    tags:
    - backend-v*
  workflow_dispatch:
    inputs:
      source:
        description: Full candidate SHA or exact backend-vMAJOR.MINOR.PATCH tag; blank = controller C
        type: string
        required: false
      target:
        description: Publication remains disabled unless externally cleared RELEASE_POLICY enables it
        type: choice
        options:
        - checks
        - backend
        - web
        - both
        default: checks
        required: true
      skip_deploy:
        description: Backend exact health verification only; never call hook
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: controller-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      candidate: ${{ steps.resolve.outputs.candidate }}
      controller: ${{ steps.resolve.outputs.controller }}
      backend: ${{ steps.resolve.outputs.backend }}
      web: ${{ steps.resolve.outputs.web }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        ref: ${{ github.sha }}
        path: control
        fetch-depth: 0
        persist-credentials: false
    - id: resolve
      env:
        CONTROLLER: ${{ github.sha }}
        REQUESTED_SOURCE: ${{ inputs.source || '' }}
        REQUESTED_TARGET: ${{ inputs.target || 'checks' }}
        RELEASE_POLICY: ${{ vars.RELEASE_POLICY }}
        BEFORE_SOURCE: ${{ github.event.before || '' }}
      run: python3 control/ops/ci/delivery_gate.py resolve --repo control --controller "$CONTROLLER"
  checks:
    needs: resolve
    uses: ./.github/workflows/checks.yml
    with:
      source_sha: ${{ needs.resolve.outputs.candidate }}
      controller_sha: ${{ needs.resolve.outputs.controller }}
      scope: all
  required:
    name: Required delivery checks
    if: always()
    needs:
    - resolve
    - checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      receipt: ${{ steps.required.outputs.receipt }}
      source: ${{ steps.required.outputs.source }}
      controller: ${{ steps.required.outputs.controller }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        ref: ${{ github.sha }}
        path: control
        fetch-depth: 0
        persist-credentials: false
    - id: required
      env:
        CONTROLLER: ${{ github.sha }}
        SOURCE: ${{ needs.resolve.outputs.candidate }}
        NEEDS: ${{ toJSON(needs) }}
      run: python3 control/ops/ci/delivery_gate.py required --repo control --controller "$CONTROLLER" --source "$SOURCE"
  publish-backend:
    needs:
    - resolve
    - required
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.required.result == 'success' && needs.resolve.outputs.backend == 'true' }}
    uses: ./.github/workflows/deploy-backend.yml
    secrets:
      DELIVERY_RENDER_DEPLOY_HOOK_URL: ${{ secrets.DELIVERY_RENDER_DEPLOY_HOOK_URL }}
    with:
      source: ${{ needs.required.outputs.source }}
      controller: ${{ needs.required.outputs.controller }}
      receipt: ${{ needs.required.outputs.receipt }}
      skip_deploy: ${{ inputs.skip_deploy || false }}
  publish-web:
    needs:
    - resolve
    - required
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.required.result == 'success' && needs.resolve.outputs.web == 'true' }}
    uses: ./.github/workflows/sync-web-viewer.yml
    secrets:
      DELIVERY_VERCEL_DEPLOY_KEY: ${{ secrets.DELIVERY_VERCEL_DEPLOY_KEY }}
    with:
      source: ${{ needs.required.outputs.source }}
      controller: ${{ needs.required.outputs.controller }}
      receipt: ${{ needs.required.outputs.receipt }}
