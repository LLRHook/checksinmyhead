name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Must match the pin in testflight.yml and app-store-release.yml. Unpinned
  # `channel: stable` meant CI validated a different Flutter than the one that
  # actually ships: CI drifted to 3.44.8 and failed on an `axisAlignment`
  # deprecation that does not exist in the version being released.
  FLUTTER_VERSION: 3.41.5

jobs:
  release-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test App Store Connect release automation
        run: ruby .github/scripts/asc_release_test.rb

      - name: Check App Store Connect script syntax
        run: |
          ruby -c .github/scripts/asc_api.rb
          ruby -c .github/scripts/asc_next_build.rb
          ruby -c .github/scripts/asc_release.rb
          ruby -c .github/scripts/asc_update_notes.rb

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Format check
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::Run 'gofmt -w .' in backend/"; exit 1; }

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # Dependabot only sees module manifests, so it reported none of the 16
      # reachable Go standard-library vulnerabilities. govulncheck also filters
      # to what the code actually calls, so it does not drown in noise.
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-bill-viewer
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: web-bill-viewer/.node-version
          cache: npm
          cache-dependency-path: web-bill-viewer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=moderate
